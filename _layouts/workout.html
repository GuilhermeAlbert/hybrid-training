---
layout: default
---
<article class="training-sheet">
  <header class="sheet-header">
    <p class="eyebrow">{{ page.category }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p>{{ page.summary }}</p>{% endif %}
    <div class="sheet-meta" aria-label="Session details">
      {% if page.duration %}<span><strong>Duration</strong> {{ page.duration }}</span>{% endif %}
      {% if page.route %}<span><strong>Route</strong> {{ page.route }}</span>{% endif %}
    </div>
  </header>

  <div class="prose exercise-list">
    {{ content }}
  </div>

  {% include workout-pagination.html %}
</article>
